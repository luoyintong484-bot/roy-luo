# ============================================================
# R7 Fortune — Nginx SPA 防 403/404 配置
# 宝塔面板 → 网站 → 站点设置 → 配置文件 → 粘贴到 server{} 内
# ============================================================

# 1. 根目录指向 Vite build 输出
root /www/wwwroot/r7fortune.com/public;
index index.html;

# 2. SPA fallback: 所有路由交给 index.html 处理（解决刷新 403/404）
location / {
    try_files $uri $uri/ /index.html;
}

# 3. API 反向代理到 Node.js 后端
location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 120s;
}

# 4. 静态资源缓存（带 hash 的文件长期缓存）
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# 5. 塔罗图片缓存
location /tarot/ {
    expires 30d;
    add_header Cache-Control "public";
}

# 6. 禁止访问敏感文件
location ~ /\. {
    deny all;
}
