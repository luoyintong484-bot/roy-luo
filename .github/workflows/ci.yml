name: CI + Auto Deploy

on:
  push:
    branches: [ main, master, ci/workflow-setup ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npx vite build

      - name: Build backend
        run: npx esbuild api/boot.ts --platform=node --bundle --format=esm --outdir=dist --banner:js="import { createRequire } from 'module';const require = createRequire(import.meta.url);"

      - name: Trigger Baota WebHook
        run: |
          echo "Triggering Baota auto-deploy..."
          curl -X POST "${{ secrets.BAOTA_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"deploy\",\"project\":\"r7fortune\",\"timestamp\":\"$(date -Iseconds)\"}" \
            --connect-timeout 10 --max-time 30 || echo "WebHook call completed"
