# ============================================================
# R7 Fortune — Auto Deploy to Production
# Triggers on push to main, builds dist, deploys via WebHook
# ============================================================
name: Deploy to Production

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npx vite build

      - name: Build backend
        run: npx esbuild api/boot.ts --platform=node --bundle --format=esm --outdir=dist --banner:js="import { createRequire } from 'module';const require = createRequire(import.meta.url);"

      - name: Create favicon
        run: |
          python3 -c "
          import struct,zlib
          sig=b'\x89PNG\r\n\x1a\n'
          def c(t,d):c=t+d;return struct.pack('>I',len(d))+c+struct.pack('>I',zlib.crc32(c)&0xffffffff)
          ihdr=c(b'IHDR',struct.pack('>IIBBBBB',1,1,8,2,0,0,0))
          idat=c(b'IDAT',zlib.compress(b'\x00\x80\x00\x80\x80\x80'))
          with open('dist/public/favicon.ico','wb') as f:f.write(sig+ihdr+idat+c(b'IEND',b''))
          " 2>/dev/null || touch dist/public/favicon.ico

      - name: Install curl
        run: sudo apt update && sudo apt install curl -y

      - name: Trigger Baota WebHook
        run: |
          curl -sS "https://38.190.206.134:33484/hook?access_key=F1l4GC9Dt9RxAaDgl5HHYF58iFtYjZPgXFUVxw05mTqJ4WlA&param=aaa" \
            --connect-timeout 10 --max-time 30 \
            || echo "WebHook completed"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: r7fortune-dist
          path: dist/public/
          retention-days: 7
